name: Build and deploy

on:
  schedule:
    - cron: "41 */3 * * *" # fallback only: cron/ (a Cloudflare Worker) starts this hourly; GitHub skips most hours
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: write # to commit data/ (view history lives in the repo)

env:
  PAGES_PROJECT: trailermath # the Cloudflare Pages project name

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python test_build.py
      - run: python build.py
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      # Pushes made with the workflow's own token don't trigger another run.
      - name: Save view history
        run: |
          git config user.name "trailer-math-bot"
          git config user.email "trailer-math-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update data" && git push)
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ env.PAGES_PROJECT }} --branch=main
